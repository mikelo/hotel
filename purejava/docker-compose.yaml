services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    # ports:
    #   - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./build
    depends_on:
      postgres:
        condition: service_healthy
      # collector:
      #   condition: service_started
      # jaeger:
      #   condition: service_started

    container_name: app
    # network_mode: "container:collector"
    # pid: "container:collector"
    environment:
      # --- DB & app settings (immutati) ---
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: demo
      DB_USER: demo
      DB_PASSWORD: demo
      CITIES: "Milan,Paris,Berlin,New York,Tokyo"
      PAST_DAYS: "1"
      TIMEZONE: "Europe/Rome"
      POLL_SECONDS: "5"

# --- OpenTelemetry: invia direttamente a Jaeger all-in-one via OTLP gRPC ---
      OTEL_SERVICE_NAME: "otel-java-demo-app"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}   # gRPC default 4317
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_EXPORTER_OTLP_INSECURE: true  # "grpc" o "http/protobuf"

# In alternativa HTTP/protobuf:
# OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
# OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://jaeger:4318/v1/traces"

# https://opentelemetry.io/docs/zero-code/java/agent/getting-started/
# Aggiunge il Java agent OpenTelemetry al comando di avvio dell'app Java

    entrypoint:
      - "java"
      - "-javaagent:/opt/app/opentelemetry-javaagent.jar"
      # - "-Dotel.javaagent.debug=true"
      # - "-Dotel.javaagent.experimental.span-batching.enabled=true"
      # - "-Dotel.exporters.otlp.tls.insecure_skip_verify=true"
      # - "-Dotel.experimental.config.file=/opt/app/otel.yaml"
      - "-jar"
      - "/opt/app/app.jar"
    volumes:
      - ./otel.yaml:/opt/app/otel.yaml:Z
# ports:
#   - "4317:4317"   # (solo se vuoi esporre dall'app; non necessario per Jaeger)
#   - "4318:4318"
  # jaeger:
  #   profiles:
  #     - jaeger
  #   image: cr.jaegertracing.io/jaegertracing/jaeger:2.14.0
  #   container_name: collector
  #   ports:
  #     - "16686:16686"  # UI
  #     - "4317:4317"    # OTLP gRPC ingest
  #     - "4318:4318"    # OTLP HTTP ingest
  #     # porte aggiuntive (Zipkin, agent) se ti servono:
  #     # - "5778:5778"
  #     # - "9411:9411"

    # All-in-one usa storage in-memory per demo

  instana-agent:
    profiles:
      - agent
    image: icr.io/instana/agent
    # network_mode: "container:app"
    # pid: "container:app"
    container_name: collector
    hostname: michele
    environment:
      - INSTANA_AGENT_ENDPOINT=${INSTANA_AGENT_ENDPOINT}
      - INSTANA_AGENT_ENDPOINT_PORT=${INSTANA_AGENT_ENDPOINT_PORT}
      - INSTANA_AGENT_KEY=${INSTANA_AGENT_KEY}
      - INSTANA_DOWNLOAD_KEY=${INSTANA_DOWNLOAD_KEY}
      - INSTANA_AUTO_PROFILE=${INSTANA_AUTO_PROFILE}
      - INSTANA_AGENT_ZONE=${INSTANA_AGENT_ZONE}
      - OTEL_TRACES_EXPORTER=zipkin
    volumes:
      - ./configuration.custom.yaml:/opt/instana/agent/etc/instana/configuration.custom.yaml:Z
      - ./custom.cfg:/opt/instana/agent/etc/instana/custom.cfg:Z

    healthcheck:

      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4317'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
